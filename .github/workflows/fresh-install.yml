name: Fresh install

# What a NEW station gets. A new station does not replay WUWF's 278 migrations (they cannot be replayed from nothing:
# see apps/portal/supabase/baseline/README.md); it installs apps/portal/supabase/baseline/schema.sql and
# product-data.sql. Two jobs keep that honest:
#
#   install-from-baseline    A real local Supabase stack (the Supabase CLI starts it inside this job) gets the baseline,
#                            then any migration newer than the baseline, and the result is checked: only the product's
#                            own data, row level security everywhere, nobody signed in, and a migration newer than the
#                            baseline applies on top of it through the CLI.
#   baseline-matches-history Plain Postgres 17 with pgvector replays WUWF's history, clears WUWF's data with
#                            apps/portal/supabase/install/clear-seed-data-for-new-station.sql, and proves the baseline is
#                            the same schema (every object) and the same product data (every row).
#
# Nothing here has credentials for, or any way to reach, a hosted Supabase project: DB_URL below is the only database
# either job talks to, and the first step of each fails the job if that is ever anything but this machine. The
# clearing script is destructive by design, is never run against WUWF's databases, and refuses any database that
# already holds an account or a named station; the second job proves both refusals.
#
# It runs when a change touches the migrations, the baseline or the install files, and by hand (Actions > Fresh
# install > Run workflow). It does not run on every code change. See apps/portal/docs/new-station-install-data.md.

on:
  pull_request:
    paths:
      - "apps/portal/supabase/migrations/**"
      - "apps/portal/supabase/baseline/**"
      - "apps/portal/supabase/install/**"
      - "apps/portal/supabase/config.toml"
      - ".github/workflows/fresh-install.yml"
  push:
    branches: [main, claude/main]
    paths:
      - "apps/portal/supabase/migrations/**"
      - "apps/portal/supabase/baseline/**"
      - "apps/portal/supabase/install/**"
      - "apps/portal/supabase/config.toml"
      - ".github/workflows/fresh-install.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-from-baseline:
    name: Install from the baseline, check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The only database this job talks to: the local one `supabase start` creates below.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4

      - name: Refuse any database that is not on this machine
        run: |
          case "$DB_URL" in
            postgresql://postgres:postgres@127.0.0.1:*) echo "Database is local: ok" ;;
            *) echo "DB_URL is not the local database. This job must never touch a hosted project."; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          # Pin to a version after the first green run, so a CLI release cannot change this job on its own.
          version: latest

      - name: Configure the disposable stack
        run: |
          # The hosted projects run Postgres 17; the repo's config.toml says 15 for local development.
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          # A new station does not get supabase/seed.sql (sample data). Turn it off for this job only.
          grep -q '^\[db.seed\]' supabase/config.toml || printf '\n[db.seed]\nenabled = false\n' >> supabase/config.toml
          # The newest CLI refuses the old [inbucket] section ("no longer supported, use [local_smtp]") and stops
          # before starting anything. This job sends no mail, so drop the section from this job's copy; the
          # repo's config.toml is left for local development on whichever CLI a developer has.
          awk '/^\[/ { skip = ($0 == "[inbucket]") } !skip' supabase/config.toml > supabase/config.toml.job
          mv supabase/config.toml.job supabase/config.toml
          ! grep -q 'inbucket' supabase/config.toml
          # Start with NO migrations: the stack must come up empty, because a new station never replays them.
          mv supabase/migrations "$RUNNER_TEMP/migrations"
          mkdir supabase/migrations
          grep -n 'major_version\|db.seed' -A1 supabase/config.toml

      - name: Start the stack (an empty Supabase project)
        run: supabase start

      - name: Helpers
        run: |
          cat > "$RUNNER_TEMP/helpers.sh" <<'SH'
          # -q: without it a "do $$ ... $$; select ..." check also prints the command tag ("DO") before its answer.
          q() { psql "$DB_URL" -v ON_ERROR_STOP=1 -qAt -c "$1"; }
          expect() { # name, query, expected
            local got; got="$(q "$2")"
            if [ "$got" = "$3" ]; then echo "ok:   $1"; else echo "FAIL: $1 -- expected '$3', got '$got'"; exit 1; fi
          }
          SH

      - name: The project starts empty
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          expect "no tables in public" "select count(*) from information_schema.tables where table_schema = 'public'" "0"
          expect "no accounts" "select count(*) from auth.users" "0"

      - name: Install the baseline
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/baseline/schema.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/baseline/product-data.sql

      - name: The baseline itself holds no release notes or procedures
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          # Checked here, before anything newer is applied: release-note history and procedures are a station's own, and a
          # baseline must never carry them. A migration written after the baseline may add a release note (the Resources rule
          # in apps/portal/CLAUDE.md requires one for any change a user would notice), so the check after those migrations
          # below only forbids procedures.
          expect "the baseline holds no release notes or procedures" "select count(*) from public.rc_articles where kind <> 'guide'" "0"
          # One version per article is a property of the baseline, so it is checked here. It cannot be checked after the newer
          # migrations: the Resources rule (apps/portal/CLAUDE.md) requires a migration to update the guide of any screen it
          # changes, and updating a guide adds a version.
          expect "one version per article" \
            "select count(*) from public.rc_articles a where (select count(*) from public.rc_article_versions v where v.article_id = a.id) <> 1" "0"

      - name: Apply the migrations newer than the baseline
        run: |
          THROUGH="$(cat supabase/baseline/BASELINE_THROUGH)"
          n=0
          for f in $(ls "$RUNNER_TEMP"/migrations/*.sql | sort); do
            v="$(basename "$f" | cut -d_ -f1)"
            if [[ "$v" > "$THROUGH" ]]; then
              echo "applying $(basename "$f")"
              psql "$DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
              psql "$DB_URL" -X -qAt -c "insert into supabase_migrations.schema_migrations (version, name) values ('$v', '$(basename "$f" .sql | cut -d_ -f2-)') on conflict do nothing"
              n=$((n + 1))
            fi
          done
          echo "$n migration(s) newer than $THROUGH"

      - name: What a new station is left with
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          # The kept list is read from the clearing script, which is where the product/station split is decided.
          KEEP="$(awk '/v_keep text\[\] := array\[/,/\];/' supabase/install/clear-seed-data-for-new-station.sql | grep -o "'[a-z_]*'" | paste -sd, -)"
          [ -n "$KEEP" ] || { echo "FAIL: could not read the kept-table list from the script"; exit 1; }
          echo "kept tables: $KEEP"

          expect "every table outside the kept list is empty" "
            do \$\$
            declare t text; n bigint; bad text := '';
            begin
              for t in select c.relname from pg_class c join pg_namespace s on s.oid = c.relnamespace
                       where s.nspname = 'public' and c.relkind = 'r' and c.relname <> all (array[$KEEP]) loop
                execute format('select count(*) from public.%I', t) into n;
                if n > 0 then bad := bad || t || '=' || n || ' '; end if;
              end loop;
              if bad <> '' then raise exception 'not empty: %', bad; end if;
            end \$\$;
            select 'empty'" "empty"

          expect "the registry is intact" "select count(*) from public.tools" "12"
          expect "nobody has an account" "select (select count(*) from public.profiles) + (select count(*) from auth.users)" "0"
          expect "the station row is intact and unnamed" "select count(*) from public.station_settings where display_name is null" "1"
          # A migration newer than the baseline may add a release note; it may never add a procedure (the baseline itself is
          # checked for both in the step before the newer migrations are applied).
          expect "no procedures" "select count(*) from public.rc_articles where kind = 'procedure'" "0"
          expect "guides are present" "select count(*) > 50 from public.rc_articles where kind = 'guide'" "t"
          expect "Academic Partnerships is closed and has no calendar link" \
            "select (not is_open) and google_appointments_url is null from public.ap_settings" "t"
          expect "Bookings is closed and offers no packages" \
            "select (not is_open) and cardinality(offered_packages) = 0 from public.bk_settings" "t"

          # The security properties that matter most on a database nobody has looked at yet.
          expect "row level security is on for every table in public" \
            "select count(*) from pg_class c join pg_namespace s on s.oid = c.relnamespace where s.nspname = 'public' and c.relkind in ('r','p') and not c.relrowsecurity" "0"
          expect "storage buckets and their policies are installed" \
            "select (select count(*) from storage.buckets) > 0 and (select count(*) from pg_policy where polrelid = 'storage.objects'::regclass) > 0" "t"
          expect "the sign-up trigger on auth.users is installed" \
            "select count(*) from pg_trigger where tgrelid = 'auth.users'::regclass and not tgisinternal and tgname = 'on_auth_user_created'" "1"
          expect "an anonymous visitor reads none of the tool registry or the guides (rows that exist)" \
            "begin; set local role anon; select (select count(*) from public.tools) + (select count(*) from public.rc_articles); commit" "0"

          # No kept table may name a station. The exceptions are guides that describe WUWF-specific tooling (the ten
          # Bookings guides, whose screens still say WUWF, the DAD file name, and WUWF's own legacy-copy migration).
          expect "no kept table names a station" "
            do \$\$
            declare
              t text; n bigint; bad text := ''; slugs text;
              pat text := 'WUWF|\mUWF\M|Pensacola|Escambia';
            begin
              for t in select unnest(array[$KEEP]) loop
                if t in ('rc_articles', 'rc_article_versions') then continue; end if;
                execute format('select count(*) from public.%I x where row_to_json(x)::text ~* %L', t, pat) into n;
                if n > 0 then bad := bad || t || '=' || n || ' '; end if;
              end loop;
              select string_agg(distinct s.slug, ', ') into slugs from (
                select slug from public.rc_articles
                where (title || ' ' || coalesce(summary, '') || ' ' || body::text) ~* pat
                union all
                select a.slug from public.rc_article_versions v join public.rc_articles a on a.id = v.article_id
                where row_to_json(v)::text ~* pat
              ) s
              where s.slug not like 'bookings-%' and s.slug not in ('log-dad-log', 'underwriting-migrate-legacy-copy');
              if slugs is not null then bad := bad || 'guides: ' || slugs; end if;
              if bad <> '' then raise exception 'these still name a station: %', bad; end if;
            end \$\$;
            select 'clean'" "clean"

      - name: A newer migration applies on top of the installed baseline, through the CLI
        run: |
          # The layout the upstream repository will have: a migrations folder that starts at the baseline. (WUWF's own
          # folder cannot be used for this: three pairs of its files share a version, which the history cannot record.)
          # The baseline recorded itself in the history as version $THROUGH, so the CLI must see that file as applied
          # and offer only the newer probe.
          #
          # Migrations newer than the baseline were applied and recorded in the history by the step above, so the CLI
          # must see their files too (a history entry with no file makes it stop: "Remote migration versions not found").
          # They are copied in as the layout will have them, and the probe sorts after the newest of them.
          set -o pipefail
          THROUGH="$(cat supabase/baseline/BASELINE_THROUGH)"
          newest="$THROUGH"
          applied=0
          for f in $(ls "$RUNNER_TEMP"/migrations/*.sql | sort); do
            v="$(basename "$f" | cut -d_ -f1)"
            if [[ "$v" > "$THROUGH" ]]; then
              cp "$f" "supabase/migrations/$(basename "$f")"
              newest="$v"
              applied=$((applied + 1))
            fi
          done
          probe=$((newest + 1))
          printf -- '-- stands in for the baseline in this check; it is recorded as applied and must not run again\nselect 1;\n' > "supabase/migrations/${THROUGH}_baseline.sql"
          echo "create table public.ci_probe (id int primary key);" > "supabase/migrations/${probe}_ci_probe.sql"
          supabase db push --local --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          grep -q "${probe}_ci_probe.sql" "$RUNNER_TEMP/dry-run.txt" || { echo "FAIL: the newer migration was not offered"; exit 1; }
          ! grep -q "_baseline.sql" "$RUNNER_TEMP/dry-run.txt" || { echo "FAIL: the CLI wants to run the baseline again"; exit 1; }
          for f in $(ls supabase/migrations/*.sql | sort); do
            v="$(basename "$f" | cut -d_ -f1)"
            if [[ "$v" > "$THROUGH" && "$v" != "$probe" ]]; then
              ! grep -q "$(basename "$f")" "$RUNNER_TEMP/dry-run.txt" || { echo "FAIL: the CLI wants to run $(basename "$f") again"; exit 1; }
            fi
          done
          supabase db push --local --yes
          . "$RUNNER_TEMP/helpers.sh"
          expect "the newer migration was applied" "select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'ci_probe'" "1"
          expect "the history holds the baseline, the migrations applied above, and the probe" "select count(*) from supabase_migrations.schema_migrations" "$((2 + applied))"

      - name: Show what happened, if it failed
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true

      - name: Stop and discard the stack
        if: always()
        run: supabase stop --no-backup || true

  baseline-matches-history:
    name: Baseline equals WUWF's history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
      REPLAY_URL: postgresql://postgres:postgres@127.0.0.1:54329/replay
      INSTALLED_URL: postgresql://postgres:postgres@127.0.0.1:54329/installed
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4

      - name: Refuse any database that is not on this machine
        run: |
          for u in "$ADMIN_URL" "$REPLAY_URL" "$INSTALLED_URL"; do
            case "$u" in
              postgresql://postgres:postgres@127.0.0.1:*) ;;
              *) echo "$u is not a local database. This job must never touch a hosted project."; exit 1 ;;
            esac
          done
          echo "Databases are local: ok"

      - name: Helpers
        run: |
          cat > "$RUNNER_TEMP/helpers.sh" <<'SH'
          # -q: without it a "do $$ ... $$; select ..." check also prints the command tag ("DO") before its answer.
          q() { psql "$REPLAY_URL" -v ON_ERROR_STOP=1 -qAt -c "$1"; }
          expect() { # name, query, expected
            local got; got="$(q "$2")"
            if [ "$got" = "$3" ]; then echo "ok:   $1"; else echo "FAIL: $1 -- expected '$3', got '$got'"; exit 1; fi
          }
          SH

      - name: Two empty databases with the Supabase parts the migrations need
        run: |
          for d in replay installed; do
            psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -c "create database $d"
            # The second run's "role already exists" errors are expected (roles are shared by the whole server).
            psql "postgresql://postgres:postgres@127.0.0.1:54329/$d" -X -q -f supabase/baseline/local-stubs.sql || true
            psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -c "alter database $d set search_path = \"\$user\", public, extensions"
          done

      - name: Replay WUWF's history up to the baseline
        run: |
          PGHOST=127.0.0.1 PGPORT=54329 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=replay \
            THROUGH="$(cat supabase/baseline/BASELINE_THROUGH)" supabase/baseline/replay-history.sh

      - name: A database built from the migrations alone
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          expect "the 12 registry rows exist without seed.sql" "select count(*) from public.tools" "12"
          expect "no user accounts yet" "select count(*) from public.profiles" "0"
          expect "one station settings row" "select count(*) from public.station_settings" "1"
          expect "the station has no name" "select display_name is null from public.station_settings" "t"
          # Without these the clearing below would prove nothing.
          expect "WUWF's data is in the replay (programs)" "select count(*) > 0 from public.log_programs" "t"
          expect "WUWF's data is in the replay (pillars)" "select count(*) > 0 from public.ep_pillars" "t"
          expect "WUWF's release notes are in the replay" "select count(*) > 0 from public.rc_articles where kind = 'release_note'" "t"

      - name: The script refuses a database that has a named station
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          before="$(q "select count(*) from public.log_programs")"
          q "update public.station_settings set display_name = 'Some Station' where id" >/dev/null
          if psql "$REPLAY_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/install/clear-seed-data-for-new-station.sql; then
            echo "FAIL: the script ran against a database with a named station"; exit 1
          fi
          expect "nothing was cleared" "select count(*) from public.log_programs" "$before"
          q "update public.station_settings set display_name = null where id" >/dev/null

      - name: The script refuses a database that has an account
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          before="$(q "select count(*) from public.log_programs")"
          # One transaction: add an account, then try the script. The refusal aborts it all, the account included.
          if psql "$REPLAY_URL" -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          insert into auth.users (id, email, aud, role) values (gen_random_uuid(), 'someone@example.org', 'authenticated', 'authenticated');
          \i supabase/install/clear-seed-data-for-new-station.sql
          SQL
          then
            echo "FAIL: the script ran against a database that has an account"; exit 1
          fi
          expect "nothing was cleared" "select count(*) from public.log_programs" "$before"
          expect "the test account was rolled back" "select count(*) from auth.users" "0"

      - name: Clear WUWF's data
        run: psql "$REPLAY_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/install/clear-seed-data-for-new-station.sql

      - name: Install the baseline into the second database
        run: |
          psql "$INSTALLED_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/baseline/schema.sql
          psql "$INSTALLED_URL" -X -v ON_ERROR_STOP=1 -f supabase/baseline/product-data.sql

      - name: The baseline is the same schema and the same product data as the history
        run: supabase/baseline/verify.sh "$REPLAY_URL" "$INSTALLED_URL"

      - name: Running the script again changes nothing
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          before="$(q "select count(*) from public.rc_articles")|$(q "select count(*) from public.tools")"
          psql "$REPLAY_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/install/clear-seed-data-for-new-station.sql
          after="$(q "select count(*) from public.rc_articles")|$(q "select count(*) from public.tools")"
          [ "$before" = "$after" ] && echo "ok:   unchanged ($after)" || { echo "FAIL: $before -> $after"; exit 1; }
